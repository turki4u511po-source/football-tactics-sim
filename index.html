<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محاكي التكتيك الكروي — Football Tactics Simulator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1 data-i18n="title"></h1>
        <span class="tag" data-i18n="phaseTag"></span>
      </div>
      <div id="hud" class="hud"></div>
    </header>

    <div id="setup" class="setup"></div>

    <main class="stage">
      <canvas id="pitch"></canvas>
    </main>

    <footer class="dock">
      <div id="controls" class="controls"></div>
      <p class="hint" data-i18n="hint"></p>
    </footer>

    <aside id="panel" class="panel"></aside>
    <div id="analytics" class="analytics"></div>
    <div id="lab" class="analytics lab"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
